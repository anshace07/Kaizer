      - धुंआ
      - धुआ
      - धुंए
      - धुएं
      - धुएँ
      - धुवाँ
      - smoke aa raha
      - smoke nikal
      - dhuan nikal
      - धुआं निकल
    except:
      - smoke detector
      - no smoking
      - smoking area
      - smoking zone

