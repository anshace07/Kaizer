# PlantPulse AI — deterministic safety rules.
#
# If ANY safety keyword appears in the raw transcript or extracted symptoms,
# or a specifically designated incident_type matches, the incident becomes
# CRITICAL + ESCALATED.
#
# The LLM can never lower or suppress a deterministic safety alert.
#
# Matching uses app/text_norm.normalize() and whole-word comparisons.
#
# Negation deliberately does not suppress safety alerts.
#
# Exceptions remove harmless compound nouns before matching.

rules:
  - id: S1
    name: Smoke
    incident_types: [smoke]
    keywords:
      - smoke
      - smoky
      - smoking
      - dhuan
      - dhuaan
      - dhua
      - dhuwan
      - dhuva
      - dhuen
      - धुआं
